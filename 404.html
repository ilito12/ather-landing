<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ather Messenger</title>
  <style>
    body { background: #000; color: #00FF66; font-family: monospace;
           display: flex; justify-content: center; align-items: center;
           min-height: 100vh; margin: 0; padding: 20px; text-align: center; }
    .box { max-width: 400px; width: 100%; }
    h1 { font-size: 32px; letter-spacing: 4px; margin-bottom: 8px; }
    p { color: #888; font-size: 14px; }
    .btn { display: block; margin: 16px 0; padding: 16px;
           background: #00FF66; color: #000; text-decoration: none;
           border-radius: 10px; font-weight: bold; letter-spacing: 1px; }
    .btn:hover { opacity: 0.85; }
    .secondary { background: transparent; color: #00FF66;
                 border: 2px solid #00FF66; }
  </style>
</head>
<body>
  <div class="box">
    <h1>// ATHER</h1>
    <p id="msg">Открываем профиль...</p>
    <a class="btn" href="https://github.com/ilito12/Aether-messenger/releases/latest/download/ather.apk">
      ⬇️ Скачать APK
    </a>
    <a class="btn secondary" href="https://github.com/ilito12/Aether-messenger">
      📦 GitHub
    </a>
    <p style="color: #444; font-size: 11px; margin-top: 24px;">
      Уже установлено? Открой ссылку заново — приложение откроется автоматически.
    </p>
  </div>

  <script>
    const path = window.location.pathname;
    const parts = path.split('/').filter(Boolean);
    const username = parts[parts.length - 1] || '';

    // Выполняем deep-link только если URL содержит /u/<username>
    if (username && username !== 'u' && path.includes('/u/')) {
      document.getElementById('msg').textContent = 'Открываем профиль @' + username + '...';
      const deepLink = 'ather://profile/' + username;
      setTimeout(() => {
        window.location.href = deepLink;
      }, 200);
    } else {
      document.getElementById('msg').textContent = 'Тебя пригласили в Ather Messenger';
    }
  </script>
</body>
</html>
